summary: 'Treasury is consulting on implementation details for a proposed 30 per cent
  minimum tax on discretionary trusts. The consultation paper says the measure is
  intended to apply from 1 July 2028, with expanded rollover relief available for
  three years from 1 July 2027 for trusts that choose to restructure. Treasury is
  seeking feedback on the core arrangements and exclusions, treatment of distributions
  to income-tax exempt entities, rollover relief, excess franking credits, collection
  mechanisms, and interactions with unpaid present entitlement issues following Commissioner
  of Taxation v Bendel. Submissions close on 31 July 2026.

  '
