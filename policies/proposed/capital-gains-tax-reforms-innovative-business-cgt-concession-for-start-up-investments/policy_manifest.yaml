summary: 'Treasury consulted on proposed arrangements for an Innovative Business CGT
  Concession as part of the Australian Government''s broader 2026-27 Budget capital
  gains tax reforms. The consultation paper proposes a targeted 50 per cent discount
  on nominal capital gains for eligible early investments in innovative start-ups,
  including qualifying shares and options held by founders, employee share scheme
  participants, early stage investors, and some limited partnership fund general partners.
  Proposed design questions include start-up age and turnover thresholds, possible
  longer eligibility for biotech, medtech and deep-tech firms, innovation criteria,
  excluded activities, a five-year minimum holding period, a $10 million lifetime
  cap, and transitional treatment for existing shares. The consultation opened on
  17 June 2026 and closed on 10 July 2026.

  '
